# In-cluster build of the Dark NOC agent from this Git branch (ocpai35):
# layers implementation/phase-05-agent-mcp/agent/{agent.py,state.py} onto the
# released agent image. Adds field-service dispatch and auto-resolved tickets.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: dark-noc-agent
  namespace: dark-noc-hub
  labels:
    app.kubernetes.io/part-of: dark-noc
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dark-noc-agent-layer
  namespace: dark-noc-hub
  labels:
    app.kubernetes.io/part-of: dark-noc
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/msugur/auto-darknoc.git
      ref: ocpai35
    contextDir: implementation/phase-05-agent-mcp/agent
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.layer
      pullSecret:
        name: quay-pull
  output:
    to:
      kind: ImageStreamTag
      name: dark-noc-agent:ocpai35
  triggers:
    - type: ConfigChange
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
