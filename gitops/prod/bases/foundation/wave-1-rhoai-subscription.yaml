# =============================================================
# Red Hat OpenShift AI 3.4 — Operator Subscription
# =============================================================
# PURPOSE:
#   Installs the RHOAI operator which manages the entire
#   AI/ML platform: model serving, LlamaStack, workbenches,
#   pipelines, and the model registry.
#
# WHY RHOAI 3.4:
#   - Models-as-a-Service is GA for governed model access
#   - MLflow Operator is managed by DataScienceCluster
#   - NeMo Guardrails is supported for safety controls
#   - AutoML and AutoRAG are available as Technology Preview
#   - Llama Stack Responses API improves OpenAI compatibility
#   - llm-d distributed inference adds 3.4 scheduler/metrics updates
#
# NOTE: RHOAI 3.x is NOT an upgrade from 2.x — fresh install only.
#       If rhods-operator 2.x is already installed, uninstall first.
#
# APPLY WITH:
#   oc apply -f wave-1-rhoai-subscription.yaml
#
# VERIFY:
#   oc get csv -n redhat-ods-operator | grep rhods-operator
#   # Wait for: rhods-operator.v3.4.x    Succeeded
#
# WHAT HAPPENS AFTER:
#   - RHOAI operator pod starts in redhat-ods-operator namespace
#   - redhat-ods-applications namespace gets created automatically
#   - DataScienceCluster CR must be created next (phase-03)
# =============================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-operator
  labels:
    app.kubernetes.io/part-of: dark-noc
    dark-noc/layer: ai-platform
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
  labels:
    app.kubernetes.io/part-of: dark-noc
spec:
  channel: stable-3.4       # pin OpenShift AI 3.4 stream
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # config:
  #   env:
  #   - name: "DISABLE_DSC_CONFIG"
  #     value: "false"
