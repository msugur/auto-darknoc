# Ansible Lightspeed intelligent assistant -> OpenShift AI model (vLLM).
# Points at the same InferenceService the Dark NOC agent uses
# (stacks/hub/ai-core/model-binding-configmap.yaml). The endpoint is in-cluster
# and unauthenticated, so the token is a placeholder (no credential stored).
# Note: Lightspeed *code generation* requires IBM watsonx Code Assistant
# (model_config_secret_name); the intelligent assistant supports RHOAI vLLM.
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-chatbot-config
  namespace: aap
  labels:
    app.kubernetes.io/part-of: dark-noc
type: Opaque
stringData:
  chatbot_model: llama-32-3b-instruct
  chatbot_url: http://llama-32-3b-instruct-predictor.my-first-model.svc.cluster.local:8080/v1
  chatbot_token: not-required
  chatbot_llm_provider_type: rhoai_vllm
  chatbot_context_window_size: "16000"
  chatbot_temperature_override: "0"   # deterministic: fewer invented tool calls on a 3B model
