apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ogx-server.yaml
  - gen-ai-mcp-servers.yaml
  - rag-docs-seed-job.yaml
  - rag-runbooks-seed-job.yaml
  - ocpai-34-demo-enablement.yaml
configMapGenerator:
  # Base config of the rh OGX distribution (extracted from
  # odh-ogx-core-rhel9 /opt/app-root/config.yaml). Supplying it avoids the
  # operator fetching image labels from registry.redhat.io, which 401s.
  - name: ogx-base-config
    namespace: dark-noc-hub
    options:
      labels:
        ogx.io/watch: "true"
        app.kubernetes.io/part-of: dark-noc
    files:
      - config.yaml=ogx-base-config.yaml
  - name: rag-docs-seed-script
    namespace: dark-noc-rag
    files:
      - seed-product-docs.py
  - name: rag-docs-sources
    namespace: dark-noc-rag
    files:
      - documentation-sources.yaml
  - name: rag-runbooks-seed-script
    namespace: dark-noc-rag
    files:
      - seed-knowledge-base.py
  - name: rag-runbooks
    namespace: dark-noc-rag
    files:
      - runbooks/aap-job-failure.md
      - runbooks/certificate-expired.md
      - runbooks/dns-failure.md
      - runbooks/kafka-consumer-lag.md
      - runbooks/network-timeout.md
      - runbooks/nginx-config-error.md
      - runbooks/nginx-crashloop.md
      - runbooks/nginx-oomkilled.md
      - runbooks/postgres-connection-pool.md
      - runbooks/storage-full.md
generatorOptions:
  disableNameSuffixHash: true
