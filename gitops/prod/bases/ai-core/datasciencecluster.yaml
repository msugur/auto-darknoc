# =============================================================
# DataScienceCluster — Activates OpenShift AI 3.4 Components
# =============================================================
# PURPOSE:
#   The DataScienceCluster CR is the master switch for OpenShift AI 3.4.
#   It controls which RHOAI components are enabled/disabled.
#   Apply this AFTER the RHOAI operator CSV is Succeeded.
#
# OPENSHIFT AI 3.4 TRACK:
#   - ModelServing: Serverless (KNative) is DEPRECATED.
#     Use KServe RawDeployment mode instead.
#     Set: kserve.managementState: Managed (not serverless)
#   - Accelerator Profiles RENAMED to Hardware Profiles
#   - TGIS runtime REMOVED — use vLLM exclusively
#   - MLflow Operator is managed through this CR
#   - NeMo Guardrails is supported for safe model access
#   - Kubeflow Training Operator v2 is the training path; v1 is deprecated
#   - CodeFlare Operator was removed from OpenShift AI 3.4
#
# COMPONENTS ENABLED:
#   - Dashboard:          RHOAI Web console
#   - Workbenches:        JupyterLab environments
#   - ModelController:    KServe controller
#   - Kserve:             Model serving (RawDeployment mode)
#   - ModelRegistry:      Model catalog backed by MinIO
#   - DataSciencePipelines: AI workflow pipelines (formerly DS Pipelines)
#   - LlamaStack:         Agent/RAG orchestration
#   - MLflowOperator:     Experiment tracking and lifecycle metadata
#   - TrainingOperator:   Kubeflow Trainer v2 based model training
#   - TrustyAI:           Evaluation/guardrails integration surface
#
# COMPONENTS DISABLED:
#   - CodeFlare:          Removed in OpenShift AI 3.4
#
# APPLY WITH:
#   oc apply -f datasciencecluster.yaml
#
# VERIFY:
#   oc get datasciencecluster
#   oc get pods -n redhat-ods-applications
#   oc get route rhods-dashboard -n redhat-ods-applications
# =============================================================
---
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  labels:
    app.kubernetes.io/part-of: dark-noc
spec:
  components:
    # RHOAI Dashboard — web console for data scientists
    dashboard:
      managementState: Managed

    # Workbenches — JupyterLab for exploration and testing
    workbenches:
      managementState: Managed

    # KServe — model serving with RawDeployment (NOT Serverless)
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headless
      modelsAsService:
        managementState: Managed

    # ModelRegistry — model catalog backed by MinIO
    modelregistry:
      managementState: Managed
      registriesNamespace: "rhoai-model-registries"

    # Data Science Pipelines (formerly AI Pipelines in 2.x)
    aipipelines:
      managementState: Managed

    # LlamaStack — agent framework, RAG APIs, Responses API path
    llamastackoperator:
      managementState: Managed

    # MLflow Operator — experiment tracking and model lifecycle metadata
    mlflowoperator:
      managementState: Managed

    # TrustyAI — model monitoring, safety/evaluation integrations
    trustyai:
      managementState: Managed
      mcpGuardrailsMode: true

    # KubeRay — distributed workloads used by AutoML/training demos
    ray:
      managementState: Managed

    # Kubeflow Trainer v2
    trainer:
      managementState: Managed

    # CodeFlare — removed in OpenShift AI 3.4
    codeflare:
      managementState: Removed

    # Kubeflow Trainer v2 — model customization/training path
    trainingoperator:
      managementState: Managed
